[project]
name = "gearcore"
version = "2.2.0"
description = "Unified skill and MCP hub with layered project-scoped configuration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "ai-tools", "claude", "codex", "opencode", "skills", "context-window", "developer-tools"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "anyio>=4.12.1",
    # mcp 2.0 removed the low-level Server.list_tools()/call_tool() decorator
    # API the hub is built on; cap below 2.0 until the hub is ported.
    "mcp>=1.26.0,<2.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line too long — handled by formatter

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[project.scripts]
gearcore = "gearcore_hub.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gearcore_hub"]
