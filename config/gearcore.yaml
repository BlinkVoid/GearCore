version: 2

registry:
  mcp_servers:
    # HIVE Gateway — worker task queue and registration
    - id: hive-gateway
      type: sse
      url: http://127.0.0.1:7111/sse
      enabled: true

    # MemCore — persistent tiered memory (HTTP transport)
    - id: memcore
      type: http
      url: http://127.0.0.1:8080/sse
      enabled: false  # enable when MemCore server is running

    # Playwright — browser automation
    - id: playwright
      type: stdio
      command: npx
      args:
        - -y
        - "@playwright/mcp"
      enabled: false  # enable when web-research is needed

  skills_dirs:
    - ~/.config/gearcore/skills   # global user skills
    - ~/.config/agents/skills     # shared with kimi / other tools

disclosure:
  strategy: manual
  activation_threshold: 0.85
  core_skills:
    - first-principles-scientific-mindset
  # Auto-load the reasoning discipline skill globally. It carries no tools and keeps
  # the default operating model grounded in fundamentals, evidence, and validation.

resolution:
  auto_deduplicate: true
  categories:
    web_search:
      preferred: playwright
      strategy: suppress_others
