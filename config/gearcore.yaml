hub:
  disclosure_strategy: semantic
  host: 127.0.0.1
  log_level: info
  port: 8686
  process_timeout_ms: 3600000

mcp_servers:
  # Filesystem — restricted to honeycomb workspace
  - id: filesystem
    type: stdio
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem'
      - E:/workspace/Swarm/honeycomb
    enabled: true

  # Swarm Gateway — worker task queue and registration
  - id: swarm-gateway
    type: sse
    url: http://127.0.0.1:7111/sse
    enabled: true

resolution:
  auto_deduplicate: true
  categories:
    file_io:
      namespace_prefix: fs_
      preferred: filesystem
      strategy: namespace

skills:
  directory: ./skills
  activation_threshold: 0.85
  core_skills:
    - swarm-worker
