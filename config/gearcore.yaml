version: 2

registry:
  mcp_servers:
    # Filesystem — restricted to local workspace
    - id: filesystem
      type: stdio
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-filesystem"
        - /home/r345/workspace
      enabled: true

    # HIVE Gateway — worker task queue and registration
    - id: hive-gateway
      type: sse
      url: http://127.0.0.1:7111/sse
      enabled: true

    # MemCore — persistent tiered memory
    - id: memcore
      type: stdio
      command: /home/r345/workspace/MemCore/.venv/bin/python
      args:
        - -m
        - src.memcore.main
        - --mode
        - stdio
      env:
        PYTHONPATH: /home/r345/workspace/MemCore
      enabled: false  # enable after MemCore venv is rebuilt

    # Playwright — browser automation
    - id: playwright
      type: stdio
      command: npx
      args:
        - -y
        - "@playwright/mcp"
      enabled: false  # enable when web-research is needed

  skills_dirs:
    - ~/.config/gearcore/skills   # global user skills
    - ~/.config/agents/skills     # shared with kimi / other tools

disclosure:
  strategy: manual
  activation_threshold: 0.85
  core_skills: []   # nothing auto-loaded globally — projects set their own core_skills

resolution:
  auto_deduplicate: true
  categories:
    file_io:
      preferred: filesystem
      strategy: namespace
      namespace_prefix: fs_
    web_search:
      preferred: playwright
      strategy: suppress_others
