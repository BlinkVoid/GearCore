version: 2

registry:
  mcp_servers:
    # Swarm Gateway — worker task queue and registration
    - id: swarm-gateway
      type: sse
      url: http://127.0.0.1:7111/sse
      enabled: true

    # SampleMemory — persistent tiered memory (HTTP transport)
    - id: sample-memory
      type: http
      url: http://127.0.0.1:8080/sse
      enabled: false  # enable when SampleMemory server is running

    # Playwright — browser automation
    - id: playwright
      type: stdio
      command: npx
      args:
        - -y
        - "@playwright/mcp"
      enabled: false  # enable when web-research is needed

  skills_dirs:
    - ~/.config/gearcore/skills   # global user skills
    - ~/.config/agents/skills     # shared with kimi / other tools

disclosure:
  strategy: manual
  activation_threshold: 0.85
  core_skills: []   # nothing auto-loaded globally — projects set their own core_skills

resolution:
  auto_deduplicate: true
  categories:
    web_search:
      preferred: playwright
      strategy: suppress_others
